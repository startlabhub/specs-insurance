name: Spec Contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-spec-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate specification contract
        run: python3 scripts/spec-preflight.py --spec-root . --json
